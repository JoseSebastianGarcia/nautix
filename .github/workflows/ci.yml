name: ci
# Runs on every push to main and release branches, and on every pull request.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nautix/contracts build
      - run: pnpm test:integration
  # Builds the image exactly as the release does (without pushing) and starts it with the demo engine,
  # so a broken Dockerfile or a server that does not boot is caught before a tag is pushed.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nautix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it and wait for /health
        run: |
          docker run -d --name nautix-ci -p 127.0.0.1:3737:3737 \
            -e NAUTIX_ENGINE=fake -v nautix-ci-data:/data nautix:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3737/api/v1/health >/dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs nautix-ci
          exit 1
