# Start Nautix:   docker compose up -d --build
# Setup token:    docker compose logs nautix
# Open:           https://localhost:3737   (self-signed certificate: accept the browser warning once)
#
# DOCKER_GID must be the group id of the docker socket on the host:
#   export DOCKER_GID=$(stat -c %g /var/run/docker.sock)
name: nautix
services:
  nautix:
    container_name: nautix
    build: .
    restart: unless-stopped
    # Bound to localhost only. Put a reverse proxy with TLS in front to reach it remotely.
    ports: ["127.0.0.1:3737:3737"]
    environment:
      # HTTPS with a self-signed certificate kept in the data volume. Add the names/IPs you use
      # to reach Nautix: NAUTIX_TLS_HOSTS=nautix.lan,192.168.1.10
      # The certificate is managed in Nautix: Settings → HTTPS certificate (local CA to trust, extra names, or your own PEM).
      # Plain HTTP (e.g. behind your own TLS proxy): remove NAUTIX_TLS.
      NAUTIX_TLS: auto
      NAUTIX_TLS_HOSTS: ${NAUTIX_TLS_HOSTS:-}
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock   # root-equivalent on the host (rootless: see SECURITY.md)
      - nautix-data:/data
    group_add: ["${DOCKER_GID:-999}"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp"]
volumes:
  nautix-data: {}
