# Sample used by the S5 self-test. Expected: 2 warnings (floating image tags), 9 folds.
name: demo
services:
  web:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      MODE: production
      DEBUG: "false"
  db:
    image: postgres
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
  cache:
    image: redis:7.4
volumes:
  data: {}
