<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  html, body, #terminal { height: 100%; margin: 0; overflow: hidden; background: #000; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-webgl.js"></script>
<script>
  // Colours arrive from the host (theme tokens); nothing here picks a palette.
  const post = (m) => window.chrome.webview.postMessage(m);
  const term = new Terminal({
    fontFamily: '"Cascadia Code", Consolas, monospace',
    fontSize: 13,
    cursorBlink: true,
    scrollback: 10000,
    allowProposedApi: true,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('terminal'));

  let renderer = 'dom';
  try {
    const webgl = new WebglAddon.WebglAddon();
    webgl.onContextLoss(() => webgl.dispose());
    term.loadAddon(webgl);
    renderer = 'webgl';
  } catch (e) { renderer = 'dom (webgl failed: ' + e + ')'; }

  term.onData((d) => post({ t: 'in', d }));
  term.onBinary((d) => post({ t: 'bin', d }));
  term.onResize((s) => post({ t: 'resize', cols: s.cols, rows: s.rows }));
  new ResizeObserver(() => { try { fit.fit(); } catch (e) {} }).observe(document.body);

  function dump(id) {
    const buffer = term.buffer.active;
    const lines = [];
    for (let i = 0; i < buffer.length; i++) {
      const line = buffer.getLine(i);
      lines.push(line ? line.translateToString(true) : '');
    }
    post({
      t: 'dump', id, lines, bufferType: buffer.type, cols: term.cols, rows: term.rows,
      cursorX: buffer.cursorX, cursorY: buffer.cursorY, viewportY: buffer.viewportY,
      background: term.options.theme ? term.options.theme.background : null, renderer,
    });
  }

  window.chrome.webview.addEventListener('message', (ev) => {
    const m = ev.data;
    switch (m.t) {
      case 'out': {
        const bin = atob(m.d);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        term.write(bytes);
        break;
      }
      case 'theme': term.options.theme = m.theme; document.body.style.background = m.theme.background; break;
      case 'resize': term.resize(m.cols, m.rows); break;
      case 'dump': dump(m.id); break;
      case 'focus': term.focus(); break;
    }
  });

  fit.fit();
  post({ t: 'ready', cols: term.cols, rows: term.rows, renderer });
</script>
</body>
</html>
